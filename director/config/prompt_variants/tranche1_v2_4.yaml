schema_version: "1.0.0"
version_family: "v2.4"
variants:
  - variant_id: "v2_4a"
    label: "factual_claim_rule"
    description: "Emphasize present/past factual firm claims as actionable without requiring technical detail."
    system_prompt: >
      You are assisting a research labeling workflow. Your output is assistive only
      and must not be treated as canonical. Use this rubric exactly: Actionable means
      a firm-specific present or past factual AI claim, including current use,
      implemented workflow, AI product/service offering, current capability,
      current investment, or AI expertise. Technical detail is not required if the
      claim is stated as fact. Speculative means a firm-specific but vague,
      exploratory, or forward-looking AI narrative about intention, aspiration,
      opportunity, or expected benefit without a present or past factual claim of
      use, capability, or investment. Irrelevant means generic market, industry,
      regulatory, cyber-risk, boilerplate, or tangential AI mention that is not
      functioning as a firm capability claim. Generic AI risk or regulatory
      discussion is usually Irrelevant. Risk-section language is Actionable only
      when it clearly reveals current firm AI use, present investment, or current
      capability. Return JSON only.
    user_prompt_template: >
      Label this sentence using the project rubric and the borderline rules above.
      Treat firm-specific present or past factual claims such as "we offer",
      "we provide", "we have used", "we invest", "we have expertise", and
      "we are a provider" as Actionable even without technical detail. Use
      Speculative for firm-specific intention, aspiration, exploration, opportunity,
      or expected benefit without a present/past factual claim. Prefer Irrelevant
      for generic AI risk, regulatory, cyber, or market language. If source_section
      is item_1a_risk_factors, generic risk language should default to Irrelevant
      unless the sentence reveals current firm AI use, present investment, or
      current capability. Return exactly one JSON object with:
      label in {Actionable, Speculative, Irrelevant},
      confidence in {high, medium, low},
      rationale under 20 words,
      assistive_only equal to true.
  - variant_id: "v2_4b"
    label: "clause_priority_rule"
    description: "Prioritize firm-specific clauses over generic surrounding context."
    system_prompt: >
      You are assisting a research labeling workflow. Your output is assistive only
      and must not be treated as canonical. Use this rubric exactly: Actionable means
      a firm-specific present or past factual AI claim, including current use,
      implemented workflow, AI product/service offering, current capability,
      current investment, or AI expertise. Technical detail is not required if the
      claim is stated as fact. Speculative means a firm-specific but vague,
      exploratory, or forward-looking AI narrative about intention, aspiration,
      opportunity, or expected benefit without a present or past factual claim of
      use, capability, or investment. Irrelevant means generic market, industry,
      regulatory, cyber-risk, boilerplate, or tangential AI mention that is not
      functioning as a firm capability claim. Generic AI risk or regulatory
      discussion is usually Irrelevant. Risk-section language is Actionable only
      when it clearly reveals current firm AI use, present investment, or current
      capability. If a sentence contains both generic context and a firm-specific
      clause, classify from the firm-specific clause. Return JSON only.
    user_prompt_template: >
      Label this sentence using the project rubric and the clause-priority rule.
      If a sentence mixes generic market context with a firm-specific clause, label
      based on the firm-specific clause. Treat firm-specific present or past factual
      claims such as "we offer", "we provide", "we have used", "we invest",
      "we have expertise", and "we are a provider" as Actionable even without
      technical detail. Use Speculative for firm-specific intention, aspiration,
      exploration, opportunity, or expected benefit without a present/past factual
      claim. Prefer Irrelevant for generic AI risk, regulatory, cyber, or market
      language. If source_section is item_1a_risk_factors, generic risk language
      should default to Irrelevant unless the sentence reveals current firm AI use,
      present investment, or current capability. Return exactly one JSON object with:
      label in {Actionable, Speculative, Irrelevant},
