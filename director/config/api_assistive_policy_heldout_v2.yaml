schema_version: 1.0.0
mode: assistive_only
provider: openai
transport: responses_api
env_var: OPENAI_API_KEY
model: gpt-5-mini
request:
  store: false
  timeout_seconds: 60
  max_output_tokens: 200
  reasoning_effort: minimal
  text_format:
    type: json_schema
    name: assistive_label_result
    strict: true
    schema:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          enum:
          - Actionable
          - Speculative
          - Irrelevant
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        rationale:
          type: string
          minLength: 1
          maxLength: 140
        assistive_only:
          type: boolean
          enum:
          - true
      required:
      - label
      - confidence
      - rationale
      - assistive_only
budget:
  max_live_requests_per_run: 1
  max_prompt_tokens_per_call: 1200
  max_output_tokens_per_call: 200
  max_estimated_cost_usd_per_run: 0.1
selection:
  sample_input: data/validation/held_out_sentences_v2_review_sheet_10k_only.csv
  min_tokens: 12
  max_tokens: 120
  require_fragment_score_max: 0.0
telemetry:
  usage_file: director/runs/cost_usage.jsonl
  component: heldout_v2_assistive_prelabel
  cache_allowed: false
usage_policy:
  canonical: false
  allowed_use_cases:
  - rubric_check
  - bounded_smoke_test
  - heldout_candidate_prelabelling
  prohibited_use_cases:
  - canonical_training_labels
  - irr_substitute
  - held_out_training_use
prompt_spec:
  reference_rubric_path: docs/labeling_protocol.md
  label_set:
  - Actionable
  - Speculative
  - Irrelevant
  confidence_bands:
  - high
  - medium
  - low
  system_prompt: 'You are assisting a research labeling workflow. Your output is assistive
    only and must not be treated as canonical. Use this rubric exactly: Actionable
    means a firm-specific present or past factual AI claim, including current use,
    implemented workflow, AI product/service offering, current capability, current
    investment, or AI expertise. Technical detail is not required if the claim is
    stated as fact. Speculative means a firm-specific but vague, exploratory, or forward-looking
    AI narrative about intention, aspiration, opportunity, or expected benefit without
    a present or past factual claim of use, capability, or investment. Irrelevant
    means generic market, industry, regulatory, cyber-risk, boilerplate, or tangential
    AI mention that is not functioning as a firm capability claim. Generic AI risk
    or regulatory discussion is usually Irrelevant. If the primary function of a
    sentence is to disclose risk, vulnerability, exposure, dependence, threat, or
    compliance concern, default to Irrelevant even if the sentence mentions current
    AI use or third-party AI use. Risk-section language is Actionable only when it
    clearly reveals a standalone current firm AI offering, present investment, or
    current capability rather than mainly disclosing risk. Return JSON only.

    '
  user_prompt_template: 'Label this sentence using the project rubric and the borderline
    rules above. Treat firm-specific present or past factual claims such as "we offer",
    "we provide", "we have used", "we invest", "we have expertise", and "we are a
    provider" as Actionable even without technical detail. Use Speculative for firm-specific
    intention, aspiration, exploration, opportunity, or expected benefit without a
    present/past factual claim. Prefer Irrelevant for generic AI risk, regulatory,
    cyber, or market language. If the primary function of the sentence is risk disclosure,
    default to Irrelevant even when current AI use is mentioned. If source_section
    is item_1a_risk_factors, generic risk language should default to Irrelevant unless
    the sentence reveals a standalone current AI offering, present investment, or
    current capability. Return exactly one JSON object with: label in {Actionable,
    Speculative, Irrelevant}, confidence in {high, medium, low}, rationale under
    20 words, assistive_only equal to true.

    '
smoke_output:
  report_path: reports/api/api_bootstrap_smoke_test.json
